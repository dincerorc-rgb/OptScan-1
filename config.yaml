account:
  net_liq: 50000          # fallback only — real value comes from book.csv netliq
  max_premium_pct: 2.0    # per-position premium cap (%)

watchlist:
  - NVDA
  - AMZN
  - META
  - MSFT
  - GOOGL
  - AAPL
  - TSLA
  - PLTR
  - MU
  - AMD
  - ORCL
  - HOOD
  - RKLB
  - OKLO
  - IREN
  - HIMS
  - CRWV
  - MP
  - UUUU
  - USAR
  - QQQ
  - SPY
  - IWM

momentum:
  ema_fast: 20
  ema_slow: 50
  adx_min: 22
  rsi_min: 50
  rsi_max: 78            # above = extended, flag not entry
  breakout_lookback: 20  # close > N-day high
  vol_mult: 1.5          # volume vs 20d avg
  atr_contraction: 0.8   # ATR5/ATR20 below = coiled (pre-break)
  pullback_ema_tol: 0.02 # within 2% of EMA20 = pullback entry
  # --- Minervini SEPA layer ---
  tt_enabled: true
  tt_min_rules: 8               # Trend Template rules required (of 8)
  tt_require_for: [COIL]        # COIL only fires on TT pass (= VCP)
  tt_bonus_for: [BREAKOUT, PULLBACK, COIL]  # +1 score on TT pass
  tt_exempt: [QQQ, SPY, IWM]    # index ETFs keep old behaviour
  tt_bench: SPY                 # RS benchmark
  tt_sma200_rising_bars: 21     # SMA200 must be above its value 1 month ago
  tt_max_stop_pct: 8            # stop never more than 8% under pivot
  tt_vol_dry: 0.8               # 5d vol / 50d vol below = dry-up bonus

options:
  swing_dte: [30, 90]        # target expiry window for swing calls
  leaps_dte: [300, 500]      # LEAPS window
  sepa_dte: [60, 120]        # SEPA (TT-pass COIL/BREAKOUT) swing window
  sepa_delta: [0.65, 0.75]   # ITM-ish calls so a 5-8% stock stop isn't a 50% option loss
  long_call_delta: [0.40, 0.55]
  spread_short_delta: 0.25
  iv_cheap_rank: 40          # IV rank below -> outright long premium OK
  iv_rich_rank: 70           # IV rank above -> spreads / short-vol only
  min_open_interest: 200
  max_spread_pct: 0.10       # bid/ask spread cap as fraction of mid
  commission_per_contract: 0.65   # IBKR per contract per leg, counted in option edge

insider:
  enabled: true
  window_days: 5
  cluster_score_min: 3.0

bayes:                   # see bayes.py — prior = backtest win10, x evidence LRs
  prior_shrink_k: 20     # pseudo-trades at 50% mixed into the backtest prior
  damp: 0.75             # signals overlap -> use 75% of combined log-LR
  lr_cap: 4.0            # combined multiplier clamped to 0.25x..4x
  drift_days: 10         # edge applied to option P(BE) over 10 sessions only
  alert_min_post: 0      # e.g. 0.55 = drop BUY alerts with posterior < 55% (0 = off)
  margin_pp: 3           # safety margin on option edge (pp) — usable = edge − spread/commission − margin
  # alert_min_usable_pp: 0   # uncomment to drop BUY alerts whose usable option edge is below this
  learn_min_resolved: 30 # Sunday job learns LRs from outcomes after this many
  lr:                    # starting multipliers (overridden by state/bayes_lr.json once learned)
    tt_full: 1.25
    tt_weak: 0.85
    rs_with: 1.15
    rs_against: 0.90
    vol_surge: 1.20
    adx_strong: 1.10
    rsi_hot: 0.85
    insider: 1.40
    pcr_against: 0.95
    tape_with: 1.10
    tape_against: 0.85

alerts:
  send_no_setup_summary: false   # quiet unless there is a BUY/SELL
  only_on_signal: true

# open positions + net liq now live in book.csv (one book for scanner, risk gate and sizing).
# account.net_liq above is only used if book.csv is missing.
