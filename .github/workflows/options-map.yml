name: options-map

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (blank = default 16)"
        required: false
        default: ""

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install -q yfinance pandas numpy matplotlib requests
      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: python options_map.py "$TICKERS"
      - name: keep outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-map-${{ github.run_number }}
          path: out/
          retention-days: 7
