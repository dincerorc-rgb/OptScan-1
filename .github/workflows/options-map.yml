name: options-map

on:
  schedule:
    # US open + 30 min before close (ET). EDT now; after 1 Nov 2026 change to 14 and 20
    - cron: "32 13 * * 1-5"
    - cron: "32 19 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (blank = default 16)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install -q yfinance pandas numpy matplotlib requests
      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: unzip -o optmap-github.zip && python calib_run.py options_map.py "${TICKERS:-AAPL,MSFT,GOOGL,AMZN,META,NVDA,TSLA,SPY,QQQ,PLTR,IREN,SPCX,AMD,MU,DRAM,UUUU}"

      - name: keep outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-map-${{ github.run_number }}
          path: out/
          retention-days: 7
