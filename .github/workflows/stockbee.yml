name: stockbee
on:
  schedule:
    - cron: "15 21 * * 1-5"     # EOD scan: 17:15 EDT / 16:15 EST = 08:15 Melbourne (AEDT)
    - cron: "25 19 * * 1-5"     # ANTS pre-close (15:25 EDT) — script ignores it outside 15:10-15:55 ET
    - cron: "25 20 * * 1-5"     # ANTS pre-close (15:25 EST, after 1 Nov)
  workflow_dispatch:
    inputs:
      cmd:
        description: "eod | preclose --force | test   (add --dry to print only + push output to debug branch)"
        default: "eod"
permissions:
  contents: write
concurrency:
  group: stockbee
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: load book (from BOOK_CSV secret)
        env:
          BOOK_CSV: ${{ secrets.BOOK_CSV }}
        run: if [ -n "$BOOK_CSV" ]; then printf '%s\n' "$BOOK_CSV" > book.csv; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: mkdir -p state && pip install -q -r requirements.txt
      - name: run
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ]; then CMD=eod; else CMD=preclose; fi
          else CMD="${{ github.event.inputs.cmd }}"; fi
          python stockbee.py $CMD 2>&1 | tee run_out.txt
      - name: persist state
        if: ${{ !contains(github.event.inputs.cmd, '--dry') }}
        run: |
          git config user.name optscan && git config user.email optscan@users.noreply.github.com
          for f in state/stockbee_last.json state/stockbee_monitor.csv state/stockbee_signals.csv state/stockbee_universe.txt; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "stockbee state $(date -u +%F) [skip ci]" && (git pull --rebase -X theirs || true) && git push)
      - name: push dry-run output to debug branch
        if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.cmd, '--dry')
        run: |
          mkdir -p /tmp/dbg && cp run_out.txt /tmp/dbg/stockbee_out.txt && cp state/stockbee_*.json state/stockbee_*.csv /tmp/dbg/ 2>/dev/null || true
          git checkout -q --orphan debug-out
          git rm -rqf . && git clean -fdxq
          cp /tmp/dbg/* .
          git add -A && git commit -qm "stockbee dry run $(date -u +%FT%TZ) [skip ci]"
          git push -qf origin HEAD:debug
