name: pm-bot

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3h: scan markets, alert only on usable edge
    - cron: "47 8 * * 0"     # Sunday: review resolved alerts (your Brier vs market)
  workflow_dispatch:
    inputs:
      cmd:
        description: "scan | scan --dry | discover <words> | review"
        default: "scan --dry"

permissions:
  contents: write

jobs:
  pm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: mkdir -p state && pip install -q -r requirements.txt
      - name: run
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMD: ${{ github.event.inputs.cmd }}
        run: |
          if [ "${{ github.event.schedule }}" = "47 8 * * 0" ]; then CMD=review; fi
          python pm_bot.py ${CMD:-scan} 2>&1 | tee pm_out.txt
      - name: push dry-run output to debug-pm branch
        if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.cmd, '--dry')
        run: |
          mkdir -p /tmp/dbg && cp pm_out.txt /tmp/dbg/
          git config user.name optscan && git config user.email optscan@users.noreply.github.com
          git checkout -q --orphan debug-pm
          git rm -rqf . && git clean -fdxq
          cp /tmp/dbg/* .
          git add -A && git commit -qm "pm dry run $(date -u +%FT%TZ) [skip ci]"
          git push -qf origin HEAD:debug-pm
