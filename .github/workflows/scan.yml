name: optscan
on:
  schedule:
    - cron: "30 15 * * 1-5"
    - cron: "15 20 * * 1-5"
  workflow_dispatch:
    inputs:
      cmd:
        description: "scan | test-telegram | backtest NVDA"
        default: "scan"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
              - run: mkdir -p state
      - run: pip install -r requirements.txt
      - run: python run.py ${{ github.event.inputs.cmd || 'scan' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: "optscan github-actions"
      - name: persist IV history
        run: |
          git config user.name optscan && git config user.email optscan@users.noreply.github.com
          git add state/iv_history.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "iv history $(date -u +%F)" && git push)
