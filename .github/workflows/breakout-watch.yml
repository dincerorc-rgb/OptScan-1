name: breakout-watch

on:
  schedule:
    # one pass every 30 min, 13:00–20:59 UTC (covers 9:30–16:00 ET in EDT and EST); script exits fast outside the session.
    # Was: one job sleeping all session (~8,500 Actions min/month -> blew the free 2,000 on a private repo).
    - cron: "5,35 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

concurrency:
  group: breakout-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance requests
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: bwstate
          key: bw-state-${{ github.run_id }}
          restore-keys: bw-state-
      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakout_watch.py --once ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bwstate
          key: bw-state-${{ github.run_id }}
