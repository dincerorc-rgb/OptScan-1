name: breakout-watch

on:
  schedule:
    - cron: "10 13 * * 1-5"   # starts before the 9:30 ET open (EDT and EST), sleeps until the bell
    - cron: "0 19 * * 1-5"    # second leg — queues behind the first, covers the last part of the session
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

concurrency:
  group: breakout-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance requests
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: bwstate
          key: bw-state-${{ github.run_id }}
          restore-keys: bw-state-
      - name: Run watcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breakout_watch.py ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bwstate
          key: bw-state-${{ github.run_id }}
